<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://cdn.prod.website-files.com/6716222294e7b4b6c2add1e4/672af495c21c0fb947f1a023_GAS-42.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDIA ON GAS</title>
    <!-- Preload the login-screen lockup so the browser starts fetching it
         as soon as it parses the HTML, in parallel with the JS bundle.
         Without this the PNG only starts downloading after React mounts
         and renders the <img>, which gives the visible "logo drops in
         late" delay on first paint. Target = the AGENCY OF NOW composite
         actually rendered on landing + login (App.jsx). The old emblem
         preload was aimed at a file no runtime <img> references any more. -->
    <link rel="preload" as="image" href="/GAS_LOGO_FULL.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
